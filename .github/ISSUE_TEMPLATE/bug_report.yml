name: Bug Report
description: Report a bug in ts-review-graph
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the issue.
      placeholder: |
        1. Run `npx @elchika-inc/ts-review-graph install --tsconfig tsconfig.json`
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error output if any.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `npx @elchika-inc/ts-review-graph --version`
    validations:
      required: true

  - type: dropdown
    id: node
    attributes:
      label: Node.js Version
      options:
        - "20"
        - "22"
        - Other
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
